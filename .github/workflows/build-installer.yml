name: AURUM CONECT · Rhino 7 RHP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-conect-build-main
  cancel-in-progress: false

jobs:
  build-rhp:
    name: Build and validate single-file Rhino plugin
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet dependencies
        run: dotnet restore AurumConect.csproj --verbosity minimal

      - name: Build self-contained Rhino 7 plugin (.NET Framework 4.8, x64)
        run: dotnet build AurumConect.csproj --configuration Release --no-restore --verbosity minimal

      - name: Validate single RHP payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $plugin = "bin\\Release\\net48\\AurumConect.rhp"
          if (-not (Test-Path $plugin)) { throw "No se generó AurumConect.rhp." }
          $bytes = [IO.File]::ReadAllBytes($plugin)
          if ($bytes.Length -lt 100000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "El .RHP no contiene un ensamblado PE válido o no incluye sus dependencias." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset+1] -ne 0x45 -or $bytes[$peOffset+2] -ne 0 -or $bytes[$peOffset+3] -ne 0) { throw "Firma PE inválida." }
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) { throw "El complemento no es x64." }
          $strings = [Text.Encoding]::ASCII.GetString($bytes)
          foreach ($resourceName in @("AurumConect.Embedded.Microsoft.Web.WebView2.Core.dll", "AurumConect.Embedded.WebView2Loader.dll")) {
            if (-not $strings.Contains($resourceName)) { throw "No se encontró el recurso incrustado: $resourceName" }
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $plugin "artifacts\\AurumConect-Rhino7-1.0.8.rhp" -Force
          $size = (Get-Item "artifacts\\AurumConect-Rhino7-1.0.8.rhp").Length
          Write-Host "RHP x64 único validado: $size bytes. No se distribuyen DLL externas."

      - name: Upload single RHP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumConect-Rhino7-1.0.8-RHP
          path: artifacts/AurumConect-Rhino7-1.0.8.rhp
          if-no-files-found: error
          retention-days: 30

      - name: Publish single RHP release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: AURUM CONECT Rhino 7 · v1.0.8 Beta
          body: |
            Complemento de archivo único para Rhino 7 x64 y MatrixGold 3.1.

            Mejoras de diagnóstico WebView2: inicialización diferida después de mostrar la ventana, estados visibles por fase, captura detallada de excepciones y registro local en %LOCALAPPDATA%\\AurumLab\\AurumConect\\Logs\\AurumConect-1.0.8.log.

            WebView2.Core y WebView2Loader x64 permanecen integrados dentro del único .RHP. Al abrir AURUM RENDER desde el panel, Rhino genera una copia .3dm completa del documento activo (no solo objetos seleccionados) y la transfiere automáticamente al visor. Requisito externo: Microsoft Edge WebView2 Evergreen Runtime x64.

            Beta: requiere prueba real de extremo a extremo en Rhino 7 + MatrixGold 3.1.
          files: artifacts/AurumConect-Rhino7-1.0.8.rhp
          overwrite_files: true
          make_latest: true
