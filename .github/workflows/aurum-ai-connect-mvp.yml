name: AURUM AI CONNECT MVP

on:
  push:
    branches: [main]
    paths:
      - "ai-connect-mvp/**"
      - ".github/workflows/aurum-ai-connect-mvp.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-connect-mvp/**"
      - ".github/workflows/aurum-ai-connect-mvp.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-connect-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-connect-mvp/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Contract tests
        run: npm test
      - name: Build and typecheck
        run: npm run build
